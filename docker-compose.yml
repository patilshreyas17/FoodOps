services:
  mysql:
    image: mysql:8.1
    container_name: foodops-mysql
    env_file: .env
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    env_file: .env
    ports:
      - "${DISCOVERY_SERVICE_PORT}:${DISCOVERY_SERVICE_PORT}"
    environment:
      - SERVER_PORT=${DISCOVERY_SERVICE_PORT}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_PEER_NODE_READ_TIMEOUT_MS=5000
      - EUREKA_SERVER_PEER_NODE_CONNECT_TIMEOUT_MS=2000
      - EUREKA_SERVER_RESPONSE_CACHE_UPDATE_INTERVAL_MS=30000
      - EUREKA_SERVER_REGISTRY_SYNC_RETRIES=0
      - EUREKA_SERVER_WAIT_TIME_IN_MS_WHEN_SYNC_EMPTY=0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${DISCOVERY_SERVICE_PORT}/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file: .env
    ports:
      - "${GATEWAY_SERVICE_PORT}:${GATEWAY_SERVICE_PORT}"
    environment:
      - SERVER_PORT=${GATEWAY_SERVICE_PORT}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:${DISCOVERY_SERVICE_PORT}/eureka/
      - EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS=5
      - EUREKA_CLIENT_EUREKA_SERVER_CONNECT_TIMEOUT_SECONDS=10
      - EUREKA_CLIENT_EUREKA_SERVER_READ_TIMEOUT_SECONDS=10
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    env_file: .env
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      - SERVER_PORT=${PAYMENT_SERVICE_PORT}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:${DISCOVERY_SERVICE_PORT}/eureka/
      - RAZORPAY_API_KEY=${RAZORPAY_API_KEY}
      - RAZORPAY_API_SECRET=${RAZORPAY_API_SECRET}
      - EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS=5
      - EUREKA_CLIENT_EUREKA_SERVER_CONNECT_TIMEOUT_SECONDS=10
      - EUREKA_CLIENT_EUREKA_SERVER_READ_TIMEOUT_SECONDS=10
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
  app:
    build: ./Backend
    container_name: foodops-app
    env_file: .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SPRING_APPLICATION_NAME=foodops-backend
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:${DISCOVERY_SERVICE_PORT}/eureka/
      - SERVER_PORT=${SERVER_PORT}
      - EMAIL=${EMAIL}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - APP_CORS_ORIGINS=${CORS_ORIGINS}
      - EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS=5
      - EUREKA_CLIENT_EUREKA_SERVER_CONNECT_TIMEOUT_SECONDS=10
      - EUREKA_CLIENT_EUREKA_SERVER_READ_TIMEOUT_SECONDS=10
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_RAPID_API_KEY=${VITE_RAPID_API_KEY}
    container_name: foodops-frontend
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
      - VITE_RAPID_API_KEY=${VITE_RAPID_API_KEY}
      - API_GATEWAY_URL=api-gateway
    depends_on:
      api-gateway:
        condition: service_started
    restart: always
